# Curated per-currency risk-free rate and nominal GDP growth (#109, ADR 0005 section 4).
#
# Values are decimals (0.042, not 4.2). Terminal growth = min(risk_free_rate, nominal_gdp_growth).
#
# risk_free_rate: Damodaran, "Government Bond Rates and Riskfree Rates, by Currency on
#   January 1, 2026": local government bond rate on 12/31/25 minus the rating-based
#   default spread. Per-row comments show both so a curator can reproduce the figure.
# nominal_gdp_growth: IMF World Economic Outlook, October 2026 vintage, year 2030, series
#   NGDP_RPCH (real GDP growth %) and PCPIPCH (CPI inflation %); euro area code is EURO.
#   Formula: (1 + real) * (1 + cpi) - 1.
# as_of is the observation date of the risk-free rate.
#
# FLAG for maintainer: USD nominal_gdp_growth is 0.04, NOT the IMF-derived 0.0373. It is kept
#   at master's former constant so USD valuations are unchanged (issue #109 AC1).
#   Maintainer to decide whether to switch to 0.0373.

USD:
  # bond 4.18% (Aa1) - default spread 0.23% = 0.0395
  risk_free_rate: 0.0395
  # IMF USA 2030: real 1.8, CPI 1.9 -> 0.0373; FLAG: 0.04 kept for AC1, maintainer to decide
  nominal_gdp_growth: 0.04
  source: https://aswathdamodaran.blogspot.com/2026/02/data-update-4-for-2026-global.html
  gdp_source: https://www.imf.org/external/datamapper/datasets/WEO
  as_of: 2026-01-01

