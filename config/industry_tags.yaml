# Industry tag vocabulary for the company profiles (issue #333).
#
# A tag means the company LIVES ON that business: it is at least ~10% of the
# company's revenue on its latest 10-K. A sideline does not get the tag
# (Microsoft and Cisco sell security products but are not `cybersecurity`).
# Rules, sources and the format of config/company_profiles.yaml:
# docs/superpowers/specs/2026-11-08-company-profiles-industry-tags-design.md (sections 2, 5, 6).
#
# Closed list: slug (kebab-case), label (shown as a badge) and description (one
# sentence, shown as the tooltip). The count is a target of ~60-100, not a cap:
# coverage wins, so every S&P 500 company must get at least one tag. Add a tag
# when a company has no fit; never add a synonym or variant of an existing one.

